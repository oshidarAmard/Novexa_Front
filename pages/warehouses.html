<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انبارها — نوواکسا ERP</title>
  <script src="../assets/js/head.js" data-base="../"></script>
</head>
<body data-page="warehouses">
<div id="app">
  <div class="page-head">
    <div class="page-head__title">
      <div data-breadcrumb></div>
      <h1>مدیریت انبارها</h1>
      <p>شعب انباری، ظرفیت و مسئولین</p>
    </div>
    <div class="page-head__actions">
      <button class="btn btn-outline"><i data-icon="download" data-size="18"></i> <span class="hide-mobile">خروجی</span></button>
      <button class="btn btn-primary" data-modal-open="m"><i data-icon="plus" data-size="18"></i> انبار جدید</button>
    </div>
  </div>

  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="stat"><div class="stat__icon primary"><i data-icon="warehouse"></i></div><div><div class="stat__label">کل انبارها</div><div class="stat__value">۶</div></div></div>
    <div class="stat"><div class="stat__icon success"><i data-icon="check-circle"></i></div><div><div class="stat__label">فعال</div><div class="stat__value">۵</div></div></div>
    <div class="stat"><div class="stat__icon warning"><i data-icon="percent"></i></div><div><div class="stat__label">میانگین اشغال</div><div class="stat__value">۷۳٪</div></div></div>
    <div class="stat"><div class="stat__icon info"><i data-icon="dollar"></i></div><div><div class="stat__label">ارزش کل موجودی</div><div class="stat__value">۸٫۹م‌ت</div></div></div>
  </div>

  <!-- Warehouse cards grid -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;" id="whCards"></div>

  <div id="tbl"></div>

  <div class="modal-backdrop" id="m">
    <div class="modal">
      <div class="modal__header"><div class="modal__title"><i data-icon="warehouse" data-size="20"></i> انبار جدید</div><button class="icon-btn" data-modal-close><i data-icon="x" data-size="20"></i></button></div>
      <div class="modal__body">
        <div class="field"><label class="field-label">نام انبار <span class="req">*</span></label><input class="input" placeholder="مثال: انبار کرج"></div>
        <div class="form-grid">
          <div class="field"><label class="field-label">شهر</label><select class="select"><option>تهران</option><option>کرج</option><option>مشهد</option></select></div>
          <div class="field"><label class="field-label">مدیر انبار</label><input class="input" placeholder="نام کاربر"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label class="field-label">ظرفیت</label><input class="input" type="number" placeholder="۵۰۰۰"></div>
          <div class="field"><label class="field-label">کد انبار</label><input class="input" placeholder="W-07"></div>
        </div>
        <div class="field"><label class="field-label">آدرس</label><textarea class="textarea" placeholder="آدرس کامل..."></textarea></div>
      </div>
      <div class="modal__footer"><button class="btn btn-ghost" data-modal-close>انصراف</button><button class="btn btn-primary" data-modal-close onclick="UI.toast({type:'success',title:'ایجاد شد',message:'انبار جدید ایجاد شد.'})"><i data-icon="check" data-size="16"></i> ایجاد انبار</button></div>
    </div>
  </div>
</div>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  function build(){
    if(!window.NOVEXA||!window.UI)return;
    // Warehouse cards
    const cards=document.getElementById('whCards');
    cards.innerHTML=NOVEXA.WAREHOUSES.map(w=>{
      const pct=Math.round((w.used/w.capacity)*100);
      const cls=pct>85?'danger':(pct>60?'warning':'success');
      const statusMap={active:{l:'فعال',c:'success'},full:{l:'پر',c:'warning'},low:{l:'کم',c:'info'},inactive:{l:'غیرفعال',c:'neutral'}};
      const st=statusMap[w.status];
      return `<div class="card is-clickable">
        <div class="card__body">
          <div class="flex justify-between items-start">
            <div class="avatar" style="background:var(--color-primary-50);color:var(--color-primary)"><i data-icon="warehouse" data-size="20"></i></div>
            <span class="badge badge-${st.c}">${st.l}</span>
          </div>
          <h4 style="margin-top:12px;">${w.name}</h4>
          <div class="text-xs text-muted mt-1"><i data-icon="map" data-size="12"></i> ${w.city} • <i data-icon="user" data-size="12"></i> ${w.manager}</div>
          <div class="divider"></div>
          <div class="flex justify-between" style="font-size:13px;margin-bottom:6px;"><span class="text-muted">ظرفیت</span><span class="num">${NOVEXA.toFa(w.used)} / ${NOVEXA.toFa(w.capacity)}</span></div>
          <div class="progress"><div class="progress__bar ${cls==='warning'?'warning':(cls==='danger'?'danger':'success')}" style="width:${pct}%"></div></div>
          <div class="flex justify-between mt-4 text-sm">
            <div><div class="text-xs text-muted">اقلام</div><div class="fw-600">${NOVEXA.toFa(w.items)}</div></div>
            <div><div class="text-xs text-muted">ارزش</div><div class="fw-600">${NOVEXA.faMoney(w.value)}<span class="currency">ت</span></div></div>
          </div>
        </div>
      </div>`;
    }).join('');
    renderIcons(cards);

    // table
    const el=document.getElementById('tbl'); el.className='table-card';
    UI.Table.create(el,{
      data:NOVEXA.WAREHOUSES.map(w=>({...w,pct:Math.round((w.used/w.capacity)*100)})),
      pageSize:10,searchPlaceholder:'جستجوی انبار...',createText:'انبار جدید',createHref:'#',
      columns:[
        {key:'name',label:'نام انبار',type:'custom',render:(v,r)=>`<div style="display:flex;align-items:center;gap:12px;"><span class="avatar avatar-sm" style="background:var(--color-primary-50);color:var(--color-primary)"><i data-icon="warehouse" data-size="16"></i></span><div><div class="cell-strong">${v}</div><div class="cell-sub">${r.id}</div></div></div>`},
        {key:'city',label:'شهر',width:'120px'},
        {key:'manager',label:'مدیر انبار',width:'160px'},
        {key:'pct',label:'درصد اشغال',type:'progress',width:'160px'},
        {key:'items',label:'اقلام',type:'num',width:'100px'},
        {key:'value',label:'ارزش موجودی',type:'money',width:'180px'},
        {key:'status',label:'وضعیت',type:'badge',width:'120px',badges:{active:{label:'فعال',cls:'success'},full:{label:'پر',cls:'warning'},low:{label:'کم',cls:'info'},inactive:{label:'غیرفعال',cls:'neutral'}}},
        {key:'actions',label:'',type:'actions',width:'130px',actions:['view','edit','delete']}
      ]
    });
  }
  if(window.NOVEXA&&window.UI)build();else window.addEventListener('novexa:core-ready',()=>setTimeout(build,100));
</script>
</body>
</html>
