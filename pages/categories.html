<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دسته‌بندی‌ها — نوواکسا ERP</title>
  <script src="../assets/js/head.js" data-base="../"></script>
</head>
<body data-page="categories">
<div id="app">
  <div class="page-head">
    <div class="page-head__title">
      <div data-breadcrumb></div>
      <h1>دسته‌بندی محصولات</h1>
      <p>ساختار درختی دسته‌بندی کاتالوگ — ۹ دسته اصلی و فرعی</p>
    </div>
    <div class="page-head__actions">
      <button class="btn btn-outline"><i data-icon="grid" data-size="18"></i> <span class="hide-mobile">نمای شبکه‌ای</span></button>
      <button class="btn btn-outline"><i data-icon="list" data-size="18"></i> <span class="hide-mobile">نمای درختی</span></button>
      <button class="btn btn-primary" data-modal-open="catModal"><i data-icon="plus" data-size="18"></i> دسته جدید</button>
    </div>
  </div>

  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="stat"><div class="stat__icon primary"><i data-icon="folder"></i></div><div><div class="stat__label">کل دسته‌ها</div><div class="stat__value">۹</div></div></div>
    <div class="stat"><div class="stat__icon success"><i data-icon="tag"></i></div><div><div class="stat__label">دسته اصلی</div><div class="stat__value">۶</div></div></div>
    <div class="stat"><div class="stat__icon info"><i data-icon="layers"></i></div><div><div class="stat__label">زیردسته</div><div class="stat__value">۳</div></div></div>
    <div class="stat"><div class="stat__icon warning"><i data-icon="box"></i></div><div><div class="stat__label">کل محصولات</div><div class="stat__value">۸۵۴</div></div></div>
  </div>

  <div id="catTable"></div>

  <!-- Create modal -->
  <div class="modal-backdrop" id="catModal">
    <div class="modal">
      <div class="modal__header"><div class="modal__title"><i data-icon="folder" data-size="20"></i> ایجاد دسته‌بندی</div><button class="icon-btn" data-modal-close><i data-icon="x" data-size="20"></i></button></div>
      <div class="modal__body">
        <div class="field"><label class="field-label">نام دسته <span class="req">*</span></label><input class="input" id="catNameInput" placeholder="مثال: لوازم جانبی موبایل"></div>
        <div class="form-grid">
          <div class="field"><label class="field-label">دسته والد</label><select class="select" id="catParentSelect"><option value="">— اصلی —</option></select></div>
          <div class="field"><label class="field-label">نشانک (slug)</label><input class="input" placeholder="auto-generated" value="accessories"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label class="field-label">آیکون</label><select class="select"><option>📁 پوشه</option><option>📦 جعبه</option><option>🏷️ برچسب</option></select></div>
          <div class="field"><label class="field-label">رنگ</label><input class="input" type="color" value="#2563EB" style="height:42px;"></div>
        </div>
        <div class="field"><label class="field-label">توضیحات</label><textarea class="textarea" placeholder="توضیح دسته..."></textarea></div>
      </div>
      <div class="modal__footer"><button class="btn btn-ghost" data-modal-close>انصراف</button><button class="btn btn-primary" id="catCreateBtn"><i data-icon="check" data-size="16"></i> ایجاد دسته</button></div>
    </div>
  </div>
</div>

<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  async function buildCatTable(){
    if (!window.NOVEXA || !window.UI) return;
    const el = document.getElementById('catTable');
    el.className = 'table-card';

    // Data source: GET /api/Categories (see api/services.js → NovexaApi.Categories.list()).
    // The backend DTO only guarantees { id, name, parentId } (per the OpenAPI spec) — slug/
    // icon/color/productCount aren't modeled server-side yet, so we fall back to sensible
    // display defaults for those until the backend adds them. Falls back to NOVEXA mock data
    // if the API call fails (e.g. backend not running yet), so the page never breaks.
    let apiRows = null;
    try {
      apiRows = await NovexaApi.Categories.list();
    } catch (err) {
      UI.toast({ type: 'danger', title: 'خطا در دریافت دسته‌بندی‌ها', message: (err && err.message) || 'اتصال به سرور برقرار نشد؛ داده‌های نمونه نمایش داده می‌شود.' });
    }
    const source = Array.isArray(apiRows) ? apiRows : NOVEXA.CATEGORIES;
    const byId = {};
    source.forEach(c => { byId[c.id] = c; });
    const data = source.map(c => ({
      id: c.id,
      name: c.name,
      parent: (c.parentId ?? c.parent) ? (byId[c.parentId ?? c.parent]?.name || null) : null,
      slug: c.slug || String(c.name || '').trim().replace(/\s+/g, '-'),
      icon: c.icon || 'folder',
      color: c.color || '#2563EB',
      count: c.productCount ?? c.count ?? 0,
      isActive: c.isActive !== false
    }));

    // Keep the "دسته والد" dropdown in the create modal in sync with real data.
    const parentSelect = document.getElementById('catParentSelect');
    if (parentSelect) {
      parentSelect.innerHTML = '<option value="">— اصلی —</option>' +
        source.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    UI.Table.create(el, {
      data,
      pageSize: 50,
      createBtn: false,
      filters: false,
      selectable: false,
      searchPlaceholder: 'جستجوی دسته...',
      columns: [
        { key:'name', label:'نام دسته', type:'custom', render:(v,r)=>`<div style="display:flex;align-items:center;gap:12px;"><span class="avatar avatar-sm" style="background:${r.color}20;color:${r.color}">${Icon(r.icon,16)}</span><div><div class="cell-strong">${v}</div><div class="cell-sub">${r.slug}</div></div></div>` },
        { key:'parent', label:'دسته والد', type:'custom', render:(v)=> v ? `<span class="badge badge-neutral no-dot">${v}</span>` : `<span class="text-muted">اصلی</span>` },
        { key:'count', label:'تعداد محصول', type:'num', width:'140px' },
        { key:'color', label:'رنگ', type:'custom', width:'100px', render:(v)=>`<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:${v}"></span></span>` },
        { key:'actions', label:'', type:'actions', width:'130px', actions:['view','edit','delete'] }
      ]
    });
  }
  if (window.NOVEXA && window.UI) buildCatTable();
  else window.addEventListener('novexa:core-ready', () => setTimeout(buildCatTable, 100));

  document.getElementById('catCreateBtn').addEventListener('click', async () => {
    const nameEl = document.getElementById('catNameInput');
    const parentEl = document.getElementById('catParentSelect');
    const name = (nameEl.value || '').trim();
    if (!name) {
      nameEl.classList.add('is-invalid');
      UI.toast({ type: 'danger', title: 'خطای اعتبارسنجی', message: 'نام دسته الزامی است.' });
      return;
    }
    nameEl.classList.remove('is-invalid');
    const btn = document.getElementById('catCreateBtn');
    btn.classList.add('is-loading');
    try {
      await NovexaApi.Categories.create({ name, parentId: parentEl.value || null });
      UI.toast({ type: 'success', title: 'ایجاد شد', message: 'دسته‌بندی جدید ایجاد شد.' });
      UI.Modal.close('catModal');
      nameEl.value = '';
      buildCatTable();
    } catch (err) {
      UI.toast({ type: 'danger', title: 'خطا در ایجاد دسته‌بندی', message: (err && err.message) || 'عملیات ناموفق بود.' });
    } finally {
      btn.classList.remove('is-loading');
    }
  });
</script>
</body>
</html>
