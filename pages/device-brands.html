<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برندهای دستگاه — نوواکسا ERP</title>
  <script src="../assets/js/head.js" data-base="../"></script>
</head>
<body data-page="device-brands">
<div id="app">
  <div class="page-head">
    <div class="page-head__title">
      <div data-breadcrumb></div>
      <h1>برندهای دستگاه</h1>
      <p>برندهای دستگاه‌های پشتیبانی‌شده برای ثبت مدل و گارانتی</p>
    </div>
    <div class="page-head__actions">
      <button class="btn btn-outline"><i data-icon="download" data-size="18"></i> <span class="hide-mobile">خروجی</span></button>
      <button class="btn btn-primary" data-modal-open="m"><i data-icon="plus" data-size="18"></i> برند دستگاه جدید</button>
    </div>
  </div>

  <div class="alert alert-info"><span class="alert__icon"><i data-icon="info"></i></span><div><div class="alert__title">برند دستگاه چیست؟</div><div class="alert__body">برند دستگاه برای محصولات دارای گارانتی و سرویس استفاده می‌شود و از برند محصول جدا است.</div></div></div>

  <div id="tbl"></div>

  <div class="modal-backdrop" id="m">
    <div class="modal modal--sm">
      <div class="modal__header"><div class="modal__title"><i data-icon="cpu" data-size="20"></i> برند دستگاه جدید</div><button class="icon-btn" data-modal-close><i data-icon="x" data-size="20"></i></button></div>
      <div class="modal__body">
        <div class="field"><label class="field-label">نام برند <span class="req">*</span></label><input class="input" placeholder="مثال: iPhone"></div>
        <div class="field"><label class="field-label">شرکت سازنده</label><input class="input" placeholder="Apple Inc."></div>
        <div class="field"><label class="field-label">توضیحات</label><textarea class="textarea"></textarea></div>
      </div>
      <div class="modal__footer"><button class="btn btn-ghost" data-modal-close>انصراف</button><button class="btn btn-primary" data-modal-close onclick="UI.toast({type:'success',title:'افزوده شد',message:'برند دستگاه ایجاد شد.'})"><i data-icon="check" data-size="16"></i> ایجاد</button></div>
    </div>
  </div>
</div>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  function build(){
    if(!window.NOVEXA||!window.UI)return;
    const el=document.getElementById('tbl'); el.className='table-card';
    const data=NOVEXA.DEVICE_BRANDS.map((b,i)=>({id:i+1,name:b,maker:NOVEXA.pick(['Apple','Samsung','Xiaomi','Huawei','Sony','Google','Microsoft','Lenovo','HP','Asus']),models:Math.floor(3+Math.random()*24),warranty:Math.random()>0.2?'1 سال':'۶ ماه'}));
    UI.Table.create(el,{
      data,pageSize:10,searchPlaceholder:'جستجوی برند دستگاه...',createText:'برند جدید',createHref:'#',
      columns:[
        {key:'name',label:'برند دستگاه',type:'custom',render:(v)=>`<div style="display:flex;align-items:center;gap:12px;"><span class="avatar avatar-sm" style="background:#EDE9FE;color:#7C3AED"><i data-icon="cpu" data-size="16"></i></span><span class="cell-strong">${v}</span></div>`},
        {key:'maker',label:'شرکت سازنده'},
        {key:'models',label:'تعداد مدل',type:'num',width:'120px'},
        {key:'warranty',label:'گارانتی پیش‌فرض',width:'140px'},
        {key:'actions',label:'',type:'actions',width:'130px',actions:['view','edit','delete']}
      ]
    });
  }
  if(window.NOVEXA&&window.UI)build();else window.addEventListener('novexa:core-ready',()=>setTimeout(build,100));
</script>
</body>
</html>
