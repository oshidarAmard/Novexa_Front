<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واحدهای اندازه‌گیری — نوواکسا ERP</title>
  <script src="../assets/js/head.js" data-base="../"></script>
</head>
<body data-page="units">
<div id="app">
  <div class="page-head">
    <div class="page-head__title">
      <div data-breadcrumb></div>
      <h1>واحدهای اندازه‌گیری</h1>
      <p>واحدهای اندازه‌گیری محصولات برای انبار و فروش</p>
    </div>
    <div class="page-head__actions">
      <button class="btn btn-primary" data-modal-open="m"><i data-icon="plus" data-size="18"></i> واحد جدید</button>
    </div>
  </div>

  <div class="alert alert-warning"><span class="alert__icon"><i data-icon="alert"></i></span><div><div class="alert__title">توجه</div><div class="alert__body">حذف واحدهای استفاده‌شده در محصولات ممکن است باعث ناسازگاری داده شود. ابتدا محصولات را بازنگری کنید.</div></div></div>

  <div id="tbl"></div>

  <div class="modal-backdrop" id="m">
    <div class="modal modal--sm">
      <div class="modal__header"><div class="modal__title"><i data-icon="layers" data-size="20"></i> واحد جدید</div><button class="icon-btn" data-modal-close><i data-icon="x" data-size="20"></i></button></div>
      <div class="modal__body">
        <div class="field"><label class="field-label">نام واحد <span class="req">*</span></label><input class="input" placeholder="مثال: متر"></div>
        <div class="form-grid">
          <div class="field"><label class="field-label">نماد</label><input class="input" placeholder="m"></div>
          <div class="field"><label class="field-label">نوع</label><select class="select"><option>عددی</option><option>وزنی</option><option>حجمی</option><option>طول</option></select></div>
        </div>
        <div class="field"><label class="field-label">توضیحات</label><textarea class="textarea"></textarea></div>
      </div>
      <div class="modal__footer"><button class="btn btn-ghost" data-modal-close>انصراف</button><button class="btn btn-primary" data-modal-close onclick="UI.toast({type:'success',title:'افزوده شد',message:'واحد ایجاد شد.'})"><i data-icon="check" data-size="16"></i> ایجاد</button></div>
    </div>
  </div>
</div>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  function build(){
    if(!window.NOVEXA||!window.UI)return;
    const el=document.getElementById('tbl'); el.className='table-card';
    const types={عدد:'عددی',کیلوگرم:'وزنی',گرم:'وزنی',لیتر:'حجمی',متر:'طول',جعبه:'عددی',کارتن:'عددی',دستگاه:'عددی',بسته:'عددی',قوطی:'عددی'};
    UI.Table.create(el,{
      data:NOVEXA.UNITS.map(u=>({...u,type:types[u.name]||'عددی',products:Math.floor(5+Math.random()*200)})),
      pageSize:10,searchPlaceholder:'جستجوی واحد...',createText:'واحد جدید',createHref:'#',
      columns:[
        {key:'name',label:'نام واحد',type:'custom',render:(v,r)=>`<div style="display:flex;align-items:center;gap:12px;"><span class="avatar avatar-sm" style="background:var(--success-50);color:var(--success)"><i data-icon="layers" data-size="16"></i></span><div><div class="cell-strong">${v}</div><div class="cell-sub">${r.symbol}</div></div></div>`},
        {key:'symbol',label:'نماد',width:'100px'},
        {key:'type',label:'نوع',width:'140px',render:(v)=>`<span class="badge badge-neutral no-dot">${v}</span>`},
        {key:'products',label:'محصولات مرتبط',type:'num',width:'160px'},
        {key:'actions',label:'',type:'actions',width:'130px',actions:['view','edit','delete']}
      ]
    });
  }
  if(window.NOVEXA&&window.UI)build();else window.addEventListener('novexa:core-ready',()=>setTimeout(build,100));
</script>
</body>
</html>
